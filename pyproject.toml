[project]
name = "playtrain-trainers"
version = "0.1.0"
description = "Fast IMPALA(+LSTM) and PPO(+LSTM) RL trainers for playtrain environments"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    # A version spec, not a git URL: PyPI rejects direct-URL dependencies.
    # Dev checkouts still resolve to the sibling via [tool.uv.sources] below.
    "playtrain>=0.1",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "tensorboard>=2.16",
]

# playtrain lives in a sibling checkout; install it editable from the local path.
# Collaborators with a different layout can override with:
#   uv pip install -e <path-to-playtrain>
[tool.uv.sources]
playtrain = { path = "../playtrain", editable = true }

# On Linux, force torch from the PyTorch CUDA 12.8 index. PyPI's default Linux
# wheel (cu130) needs a CUDA driver >= 13.0, which FASRC doesn't ship — they're
# on driver 12.9. cu128 wheels work with any CUDA driver >= 12.8, so we get
# correct GPU support on Cannon and any other 12.x-driver cluster.
# Mac is unaffected: marker excludes darwin so torch comes from PyPI as before
# (and uses MPS).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
# Weights & Biases experiment tracking (imported lazily by wandb_tracking).
wandb = [
    "wandb>=0.16",
    "imageio>=2.31",   # ppo_eval imports it lazily, only on the wandb path
    "tensorboard>=2.16",
]
# Vectorized env backend used by the IMPALA vec-actor path on Linux.
envpool = [
    "envpool>=0.8 ; sys_platform != 'darwin'",
]
# Run-card / benchmark tooling under tools/.
tools = [
    "matplotlib>=3.8",
    "imageio>=2.34",
    "pillow>=10",
]
dev = [
    "ruff>=0.4",
    "pytest>=8",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtrain_trainers"]
